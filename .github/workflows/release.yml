name: release

on:
  push:
    tags:
      - v*

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check gofmt
        run: test -z "$(gofmt -l .)"

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1

  build:
    name: build-and-release
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -e
          COMMIT="${GITHUB_SHA::7}"
          LDFLAGS="-X main.version=${VERSION} -X main.commit=${COMMIT}"
          mkdir -p dist/linux_amd64 dist/darwin_amd64 dist/darwin_arm64 dist/windows_amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/linux_amd64/ldapact -ldflags "$LDFLAGS" ./cmd/ldapact
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o dist/darwin_amd64/ldapact -ldflags "$LDFLAGS" ./cmd/ldapact
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/darwin_arm64/ldapact -ldflags "$LDFLAGS" ./cmd/ldapact
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/windows_amd64/ldapact.exe -ldflags "$LDFLAGS" ./cmd/ldapact

      - name: Package
        run: |
          tar -cvJf ldapact-linux-amd64-${{ steps.version.outputs.VERSION }}.tar.xz -C dist/linux_amd64 ldapact
          tar -cvJf ldapact-darwin-amd64-${{ steps.version.outputs.VERSION }}.tar.xz -C dist/darwin_amd64 ldapact
          tar -cvJf ldapact-darwin-arm64-${{ steps.version.outputs.VERSION }}.tar.xz -C dist/darwin_arm64 ldapact
          tar -cvJf ldapact-windows-amd64-${{ steps.version.outputs.VERSION }}.tar.xz -C dist/windows_amd64 ldapact.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ldapact-*.tar.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
