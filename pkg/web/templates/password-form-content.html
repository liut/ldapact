{{define "password-form-content"}}
<section aria-labelledby="pw-title">
  <h1 id="pw-title">Change password</h1>
  <p class="muted">{{.DN}} — current scheme: {{.CurrentScheme}}</p>
  {{if .Error}}<div class="error-box" role="alert">{{.Error}}</div>{{end}}
  {{if .Success}}<div class="success-box" role="status">{{.Success}}</div>{{end}}
  {{if not .Success}}
  <form method="post" action="/api/entry/{{.DN | urlquery}}/password">
    <div class="form-field">
      <label for="new-password">New password</label>
      <input type="password" id="new-password" name="new_password" autocomplete="new-password" required>
    </div>
    <div class="form-field">
      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="primary">Change password</button>
      <a class="secondary" href="/api/entry/{{.DN | urlquery}}">Cancel</a>
    </div>
  </form>
  {{else}}
  <p><a href="/api/entry/{{.DN | urlquery}}">Back to entry</a></p>
  {{end}}
</section>
{{end}}
