{{define "delete-confirm-content"}}
<section aria-labelledby="delete-title">
  <h1 id="delete-title">Delete entry</h1>
  <p class="muted">{{.DN}}</p>
  <p>RDN: <strong>{{.RDN}}</strong> — direct children: <strong>{{.ChildCount}}</strong></p>
  {{if .Error}}<div class="error-box" role="alert">{{.Error}}</div>{{end}}
  <div class="warning-box" role="alert">Deleting an entry is irreversible (OpenLDAP has no recycle bin by default).</div>
  <form method="post" action="/api/entry/{{.DN | urlquery}}/delete">
    {{if gt .ChildCount 0}}
    <div class="form-field">
      <label for="confirm-dn">Type the full DN to confirm deleting a non-leaf entry</label>
      <input type="text" id="confirm-dn" name="confirm_dn" required aria-describedby="confirm-help">
      <p class="field-help" id="confirm-help">{{.DN}}</p>
    </div>
    <div class="form-field">
      <label><input type="checkbox" name="recursive" value="1"> Recursively delete the subtree (ceiling 1000)</label>
    </div>
    {{else}}
    <input type="hidden" name="confirm_dn" value="{{.DN}}">
    {{end}}
    <div class="form-actions">
      <button type="submit" class="danger">Delete entry</button>
      <a class="secondary" href="/api/entry/{{.DN | urlquery}}">Cancel</a>
    </div>
  </form>
</section>
{{end}}
