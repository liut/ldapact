{{define "login-content"}}
<section class="auth-card" aria-labelledby="login-title">
  <h1 id="login-title">Log in to ldapact</h1>
  <p class="muted">Directory administrator sign-in. The bind DN is prefilled
    from the server configuration and can be edited.</p>
  {{if .Error}}<div class="error-box" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <div class="form-field">
      <label for="login-bind-dn">Bind DN</label>
      <input type="text" id="login-bind-dn" name="bind_dn"
             value="{{.BindDN}}" autocomplete="username" spellcheck="false" required>
    </div>
    <div class="form-field">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" name="password"
             autocomplete="current-password" required>
    </div>
    <div class="form-actions">
      <button type="submit" class="primary">Log in</button>
    </div>
  </form>
</section>
{{end}}
