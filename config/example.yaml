# ldapact v1 sample server profile (R12).
# Every value below can be overridden by an env var: LDAPADM_LISTEN,
# LDAPADM_URL, LDAPADM_BASE_DN, LDAPADM_BIND_DN (env wins; empty is ignored).
server:
  listen: "127.0.0.1:8080"

ldap:
  url: "ldap://127.0.0.1:389"
  base_dn: "dc=example,dc=com"
  bind_dn: "cn=admin,dc=example,dc=com"
  # Secrets are never stored here. Set LDAPADM_BIND_PASSWORD (or
  # LDAPADM_BIND_PASSWORD_FILE pointing at a 0600 file) before starting.
  tls:
    min_version: "TLSv1.2"
    verify: true
    start_tls: true
    cert_expiry_fail_closed: true
  schema_compat: "openldap"
  tree_filter: "(objectClass=*)"
  pool_size: 8
  # RFC 2307 write scheme; default SSHA512 (KTD 6). Downgrade to "SSHA" if the
  # directory build lacks SHA-2 password support (bind verification fails).
  password_scheme: "SSHA512"

session:
  timeout_minutes: 30
  absolute_timeout_minutes: 480
  expired_action: "retry_bind"
  db_path: "/var/lib/ldapact/sessions.db"

log_level: "info"
