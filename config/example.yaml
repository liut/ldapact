# ldapact v1 sample server profile (R12).
server:
  listen: "127.0.0.1:8080"

ldap:
  url: "ldap://127.0.0.1:389"
  base_dn: "dc=example,dc=com"
  bind_dn: "cn=admin,dc=example,dc=com"
  # Secrets are never stored here. Set LDAPADM_BIND_PASSWORD (or
  # LDAPADM_BIND_PASSWORD_FILE pointing at a 0600 file) before starting.
  tls:
    min_version: "TLSv1.2"
    verify: true
    start_tls: true
    cert_expiry_fail_closed: true
  schema_compat: "openldap"
  tree_filter: "(objectClass=*)"
  pool_size: 8

session:
  timeout_minutes: 30
  absolute_timeout_minutes: 480
  expired_action: "retry_bind"
  db_path: "/var/lib/ldapact/sessions.db"

log_level: "info"
