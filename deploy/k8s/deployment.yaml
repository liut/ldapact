apiVersion: v1
kind: ConfigMap
metadata:
  name: ldapact-config
data:
  LDAPADM_LISTEN: "0.0.0.0:8389"
  LDAPADM_URL: "ldap://ldap.example.com:389"
  LDAPADM_BASE_DN: "dc=example,dc=com"
  LDAPADM_BIND_DN: "cn=admin,dc=example,dc=com"
  LDAPADM_MIN_VERSION: "TLSv1.2"
  LDAPADM_VERIFY: "true"
  LDAPADM_START_TLS: "true"
  LDAPADM_CERT_EXPIRY_FAIL_CLOSED: "true"
  LDAPADM_SCHEMA_COMPAT: "openldap"
  LDAPADM_POOL_SIZE: "8"
  LDAPADM_TIMEOUT_MINUTES: "30"
  LDAPADM_ABSOLUTE_TIMEOUT_MINUTES: "480"
  LDAPADM_EXPIRED_ACTION: "retry_bind"
  LDAPADM_DB_PATH: "/var/lib/ldapact/sessions.db"
  LDAPADM_LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: ldapact-bind
type: Opaque
stringData:
  bind-password: "CHANGE-ME"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldapact
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldapact
  template:
    metadata:
      labels:
        app: ldapact
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: ldapact
          image: ghcr.io/liut/ldapact:latest
          ports:
            - containerPort: 8389
          envFrom:
            - configMapRef:
                name: ldapact-config
          env:
            - name: LDAPADM_BIND_PASSWORD_FILE
              value: /etc/ldapact/bind-password
          volumeMounts:
            - name: bind-password
              mountPath: /etc/ldapact
              readOnly: true
            - name: sessions
              mountPath: /var/lib/ldapact
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8389
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8389
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: bind-password
          secret:
            secretName: ldapact-bind
            items:
              - key: bind-password
                path: bind-password
                mode: 0600
        - name: sessions
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ldapact
spec:
  selector:
    app: ldapact
  ports:
    - port: 8389
      targetPort: 8389
